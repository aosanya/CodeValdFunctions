syntax = "proto3";

package codevaldfunctions.v1;

option go_package = "github.com/aosanya/CodeValdFunctions/gen/go/codevaldfunctions/v1;codevaldfunctionsv1";

// Job represents a single function execution triggered by a platform event.
message Job {
  string id              = 1;
  string agency_id       = 2;
  string status          = 3;
  string function_name   = 4;
  string trigger_event   = 5;
  string trigger_payload = 6;
  string result          = 7;
  string error           = 8;
  int32  retry_count     = 9;
  string created_at      = 10;
  string started_at      = 11;
  string completed_at    = 12;
  string task_id         = 13;
  // workflow_run_id is the originating WorkflowRun ID, propagated from the
  // inbound trigger event under the platform-wide chain-through rule.
  // Empty for jobs triggered by non-pipeline events (orphan v1 policy).
  string workflow_run_id = 14;
}

// JobFilter narrows ListJobs results. All fields are optional.
message JobFilter {
  string status          = 1; // filter by job status (e.g. "pending", "running")
  string function_name   = 2; // filter by the registered function name
  string workflow_run_id = 3; // filter by originating WorkflowRun ID
}

// ── ListJobs ─────────────────────────────────────────────────────────────────

message ListJobsRequest {
  string    agency_id = 1;
  JobFilter filter    = 2;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

// ── GetJob ────────────────────────────────────────────────────────────────────

message GetJobRequest {
  string agency_id = 1;
  string job_id    = 2;
}

message GetJobResponse {
  Job job = 1;
}

// ── CancelJob ─────────────────────────────────────────────────────────────────

message CancelJobRequest {
  string agency_id = 1;
  string job_id    = 2;
}

message CancelJobResponse {
  Job job = 1;
}

// ── RollbackByWorkflowRun ─────────────────────────────────────────────────────

// RollbackByWorkflowRunRequest is the input to the CodeValdFunctions leg of
// the WorkflowRun rollback coordinator (FEAT-20260602-004 Phase 2). The
// coordinator in CodeValdWork calls this once per affected agency.
message RollbackByWorkflowRunRequest {
  string agency_id       = 1;
  // workflow_run_id is required — a global "rollback every Job" sweep is
  // intentionally not supported.
  string workflow_run_id = 2;
  // reason is the operator-supplied rollback reason recorded on each affected
  // Job and propagated to functions.job.cancelled / functions.job.rolled_back
  // events.
  string reason          = 3;
}

// RollbackByWorkflowRunResponse summarises the per-Job outcomes. Every Job
// anchored to the requested WorkflowRun appears in exactly one of the three
// slices.
message RollbackByWorkflowRunResponse {
  string          workflow_run_id     = 1;
  // cancelled_job_ids: Jobs that were in-flight (pending, running, retrying)
  // and were transitioned to cancelled.
  repeated string cancelled_job_ids   = 2;
  // rolled_back_job_ids: Jobs that had already reached completed or failed
  // and were transitioned to rolled_back (frozen audit; function outputs
  // preserved for debugging).
  repeated string rolled_back_job_ids = 3;
  // skipped_job_ids: Jobs that were already in a rollback-terminal state
  // — included so the call is observably idempotent.
  repeated string skipped_job_ids     = 4;
}

// ── DeployFunction ────────────────────────────────────────────────────────────

message DeployFunctionRequest {
  string agency_id    = 1;
  string name         = 2; // function name, e.g. "compile-flutter"
  string trigger      = 3; // trigger event, e.g. "work.task.completed"
  bytes  binary       = 4; // executable content (script, compiled binary, etc.)
  string description  = 5; // optional human-readable description
}

message DeployFunctionResponse {
  string name = 1;
  string path = 2; // path where the binary was written on the server
}

// FunctionsService exposes job management and function deployment for CodeValdFunctions.
service FunctionsService {
  // ListJobs returns all jobs for an agency, optionally filtered by status or function name.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // GetJob returns a single job by ID.
  // Error: NOT_FOUND if the job does not exist.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // CancelJob cancels a pending or running job.
  // Error: NOT_FOUND if the job does not exist.
  // Error: FAILED_PRECONDITION if the job is in a terminal state.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // RollbackByWorkflowRun applies the CodeValdFunctions leg of the WorkflowRun
  // rollback contract (FEAT-20260602-004 Phase 2): in-flight Jobs go to
  // cancelled; already-terminal Jobs go to rolled_back as a frozen audit
  // record. Called by CodeValdWork's rollback coordinator.
  // Error: INVALID_ARGUMENT if workflow_run_id is empty.
  rpc RollbackByWorkflowRun(RollbackByWorkflowRunRequest) returns (RollbackByWorkflowRunResponse);

  // DeployFunction installs a new function binary into the functions directory.
  // The function is immediately discoverable — no restart required.
  // An AI agent can call this to add new functions at runtime.
  rpc DeployFunction(DeployFunctionRequest) returns (DeployFunctionResponse);
}
